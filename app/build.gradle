plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mitun.sonora'
    compileSdk 35

    defaultConfig {
        applicationId "com.mitun.sonora"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // The release build with the debug key, so it installs over a debug build.
        // This is the build to measure: a debug build runs uncompiled.
        perf {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':files-core')
    testImplementation 'junit:junit:4.13.2'
}
